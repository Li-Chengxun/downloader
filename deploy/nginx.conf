# 抖音视频下载站 — Nginx 反向代理（HTTP 版）
#
# 首次部署用这个文件（HTTP 先跑通，顺便让 Let's Encrypt 能验证域名）。
# 拿到证书后，用 nginx-https.conf 覆盖本文件，再 docker compose exec nginx nginx -s reload
#
# 记得把下面所有 server_name 的 _ 换成你的真实域名

upstream douyin_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 验证目录（certbot --webroot 会往这里写文件）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://douyin_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 关键：视频是 GB 级大文件流式传输。
        # 开启缓冲会导致 Nginx 先把整个视频落盘/占内存，表现为下载卡住或内存暴涨。
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_connect_timeout    30s;
        proxy_read_timeout       600s;
        proxy_send_timeout       600s;
    }

    # 前端静态资源（Vue 已本地化，不需要构建）
    location /static/ {
        proxy_pass http://douyin_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;
}
