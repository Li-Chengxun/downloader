# 抖音视频下载站 — Nginx 反向代理（HTTPS 版）
#
# 用法：拿到证书后，把本文件内容覆盖到 deploy/nginx.conf，然后 reload：
#   cp deploy/nginx-https.conf deploy/nginx.conf
#   docker compose exec nginx nginx -s reload
#
# 证书申请（在服务器上执行，需先把域名解析到本机 IP）：
#   docker run --rm \
#     -v "$PWD/deploy/certs:/etc/letsencrypt" \
#     -v "$(docker volume inspect douyin-downloader_certbot-webroot -f '{{.Mountpoint}}'):/var/www/certbot" \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d your-domain.com --email you@example.com --agree-tos --no-eff-email
#
# 记得把 your-domain.com 全部替换成你的真实域名

upstream douyin_app {
    server web:8000;
    keepalive 16;
}

# HTTP：仅保留证书验证目录，其余全部跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/your-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        proxy_pass http://douyin_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 关键：视频是 GB 级大文件流式传输，必须关闭缓冲并放宽超时
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_connect_timeout    30s;
        proxy_read_timeout       1200s;
        proxy_send_timeout       600s;
    }

    location /static/ {
        proxy_pass http://douyin_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;
}
